name: Vercel Firewall — deny rule (enable only, COU-2063)

# CEO-approved reversible lockdown of the two public production hosts
# (COU-2186 decision -> COU-2194 -> COU-2195 -> COU-2063).
#
# Vercel Authentication (Deployment Protection) is not available on this plan:
# PATCH /v9/projects/{id} answered 428 invalid_sso_protection (COU-2114), so the
# approved mechanism is a Vercel Firewall (WAF) custom deny rule instead.
#
# This file lives on branch ops/cou-2063-firewall-deny and is dispatched with
# --ref on that branch. It is deliberately NOT merged to main: a push to main
# runs ci.yml -> deploy-production, and deployments are forbidden by COU-2056.
#
# Enable-only, like the deployment-protection workflow it replaces on this ref:
#   * only rules.insert is used - never PUT (whole-config replace) or DELETE,
#     so existing rules and IP lists are never removed;
#   * there is no disable path here. Reverting is one manual step in the Vercel
#     console (Firewall -> the rule -> toggle off), recorded on COU-2063.

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Only "enable" is supported. Removing the block is blocked by COU-2056.'
        type: choice
        required: true
        default: enable
        options:
          - enable
      scope:
        description: 'Kept for dispatch compatibility with the same-path workflow on main. Ignored here: the deny rule always covers both production hosts.'
        type: choice
        required: true
        default: all
        options:
          - all
          - standard
      extra_project_ids:
        description: 'Unused. Both target hosts are already known to live in VERCEL_PROJECT_ID (COU-2114).'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: vercel-protection
  cancel-in-progress: false

jobs:
  deny:
    name: Insert Firewall deny rule
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      ACTION: ${{ inputs.action }}
      RULE_NAME: 'COU-2063 lockdown'
      TARGET_HOSTS: 'casting.keens.academy talent-db-frontend.vercel.app'
    steps:
      - name: Insert deny rule and verify with status codes
        run: |
          set -euo pipefail

          if [ "$ACTION" != "enable" ]; then
            echo "::error::Only 'enable' is supported by this workflow (COU-2056)."
            exit 1
          fi

          for required in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::Repo secret $required is not set."
              exit 1
            fi
          done

          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT

          # Echoes ONLY the HTTP status code. The response body lands in
          # $body_file and is never dumped wholesale: every read goes through jq
          # and extracts named fields only, so no credential material and no
          # candidate data can reach the log.
          api() {
            local method="$1" path="$2" data="${3:-}"
            local args=(
              --silent --show-error
              --output "$body_file"
              --write-out '%{http_code}'
              --request "$method"
              --header "Authorization: Bearer $VERCEL_TOKEN"
            )
            if [ -n "$data" ]; then
              args+=(--header 'Content-Type: application/json' --data "$data")
            fi
            curl "${args[@]}" "https://api.vercel.com${path}"
          }

          field() { jq -r "$1" < "$body_file"; }
          api_error() {
            printf '%s: %s' "$(field '.error.code // "unknown"')" "$(field '.error.message // "no message"')"
          }

          cfg_qs="projectId=${VERCEL_PROJECT_ID}&teamId=${VERCEL_ORG_ID}"

          {
            echo "## Vercel Firewall — deny rule (COU-2063)"
            echo
            echo "Rule name: \`$RULE_NAME\` · target hosts: \`$TARGET_HOSTS\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          # --- current config -------------------------------------------------
          get_code="$(api GET "/v1/security/firewall/config/active?${cfg_qs}")"
          if [ "$get_code" != "200" ]; then
            detail="$(api_error)"
            echo "::error::GET firewall config returned $get_code ($detail)"
            echo "- GET firewall config: **$get_code** — $detail" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          rules_before="$(field '(.rules // []) | length')"
          names_before="$(field '[(.rules // [])[].name] | join(", ")')"
          firewall_enabled="$(field '.firewallEnabled // "unset"')"
          existing="$(field '[(.rules // [])[] | select(.name == "'"$RULE_NAME"'")] | length')"
          echo "- GET firewall config: **200** · rules before: **$rules_before** (\`$names_before\`) · firewallEnabled: \`$firewall_enabled\`" >> "$GITHUB_STEP_SUMMARY"

          # --- insert ---------------------------------------------------------
          deny_action='{"mitigate":{"action":"deny"}}'
          host_eq_groups='[{"conditions":[{"type":"host","op":"eq","value":"casting.keens.academy"}]},{"conditions":[{"type":"host","op":"eq","value":"talent-db-frontend.vercel.app"}]}]'
          host_inc_group='[{"conditions":[{"type":"host","op":"inc","value":["casting.keens.academy","talent-db-frontend.vercel.app"]}]}]'
          catch_all_group='[{"conditions":[{"type":"path","op":"pre","value":"/"}]}]'

          mk_payload() {
            jq -cn --arg name "$RULE_NAME" --argjson group "$1" --argjson act "$2" \
              '{action:"rules.insert", id:null, value:{
                  name:$name,
                  description:"CEO-approved reversible block of unauthenticated public access (COU-2186/COU-2194/COU-2063). Revert = disable this rule.",
                  active:true,
                  conditionGroup:$group,
                  action:$act
                }}'
          }

          inserted=''
          variant_used=''
          if [ "$existing" != "0" ]; then
            inserted=1
            variant_used='pre-existing'
            echo "- rule \`$RULE_NAME\` already present ($existing) — skipping insert, verifying effect only" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ -z "$inserted" ]; then
            for variant in host_eq host_inc catch_all; do
              case "$variant" in
                host_eq)   payload="$(mk_payload "$host_eq_groups" "$deny_action")" ;;
                host_inc)  payload="$(mk_payload "$host_inc_group" "$deny_action")" ;;
                catch_all) payload="$(mk_payload "$catch_all_group" "$deny_action")" ;;
              esac

              patch_code="$(api PATCH "/v1/security/firewall/config?${cfg_qs}" "$payload")"
              if [ "$patch_code" = "200" ]; then
                inserted=1
                variant_used="$variant"
                echo "- rules.insert (\`$variant\`): **200**" >> "$GITHUB_STEP_SUMMARY"
                break
              fi

              detail="$(api_error)"
              echo "::warning::rules.insert variant '$variant' returned $patch_code ($detail)"
              echo "- rules.insert (\`$variant\`): **$patch_code** — $detail" >> "$GITHUB_STEP_SUMMARY"
              case "$patch_code" in
                401|402|403)
                  echo "::error::Firewall custom rules rejected with $patch_code — plan or token-scope constraint, not a payload problem."
                  echo "> **Plan/permission constraint** ($patch_code). Custom firewall rules are not usable with this plan or token. No alternative mechanism attempted; reported to COU-2063." >> "$GITHUB_STEP_SUMMARY"
                  exit 1
                  ;;
              esac
            done
          fi

          if [ -z "$inserted" ]; then
            echo "::error::Every rules.insert variant was rejected. Nothing was changed."
            exit 1
          fi

          # --- make sure the firewall itself is on -----------------------------
          get_code="$(api GET "/v1/security/firewall/config/active?${cfg_qs}")"
          if [ "$get_code" = "200" ] && [ "$(field '.firewallEnabled // true')" = "false" ]; then
            enable_code="$(api PATCH "/v1/security/firewall/config?${cfg_qs}" '{"action":"firewallEnabled","id":null,"value":true}')"
            echo "- firewallEnabled -> true: **$enable_code**" >> "$GITHUB_STEP_SUMMARY"
          fi

          # --- verify stored state ---------------------------------------------
          get_code="$(api GET "/v1/security/firewall/config/active?${cfg_qs}")"
          if [ "$get_code" != "200" ]; then
            echo "::error::Verification GET returned $get_code ($(api_error))"
            exit 1
          fi
          rule_id="$(field '[(.rules // [])[] | select(.name == "'"$RULE_NAME"'")][-1].id // "unknown"')"
          rule_active="$(field '[(.rules // [])[] | select(.name == "'"$RULE_NAME"'")][-1].active // "unknown"')"
          rules_after="$(field '(.rules // []) | length')"
          {
            echo "- stored rule: id \`$rule_id\` · active \`$rule_active\` · variant \`$variant_used\` · rules after: **$rules_after** (before: $rules_before)"
            echo
            echo "### Status codes after the rule (measured from the runner)"
            echo
            echo "| Host | Path | Status |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          # --- verify effect: GET only, status codes only ----------------------
          sleep 20
          still_open=''
          for host in $TARGET_HOSTS; do
            for path in / /candidates /candidate/1; do
              code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 25 "https://${host}${path}" || echo 000)"
              echo "| \`$host\` | \`$path\` | **$code** |" >> "$GITHUB_STEP_SUMMARY"
              echo "$host$path -> $code"
              if [ "$code" = "200" ]; then
                still_open="$still_open ${host}${path}"
              fi
            done
          done

          if [ -n "$still_open" ]; then
            echo "::error::Still returning 200 after the deny rule:$still_open"
            {
              echo
              echo "> **Block incomplete — still 200:**$still_open"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          {
            echo
            echo "> All six target URLs are non-200. Revert = disable rule \`$RULE_NAME\` in the Vercel console (one step)."
          } >> "$GITHUB_STEP_SUMMARY"
